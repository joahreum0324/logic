<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로직큐 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#ffffff; --surface:#f7f8fa; --dots:#d9dce3;
  --ink:#1c1c1e; --slate:#555a6a; --stone:#8e91a0;
  --hairline:#e0e2e8; --hairline-strong:#c7cad5;
  --yellow:#ffd02f; --yellow-deep:#fcb900; --yellow-surface:#fff8e0; --yellow-dark:#746019;
  --teal-light:#c3faf5; --blue:#4262ff; --coral-light:#ffc6c6; --coral-dark:#600000;
  --primary:#1c1c1e; --on-primary:#ffffff;
  --panel:#ffffff; --bubble:#f7f8fa;
  --c-R:#e53935; --c-Y:#ffcf00; --c-G:#7cc219; --c-B:#3483dc;
  --font:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#17171a; --surface:#202024; --dots:#34343b; --ink:#f2f2f4; --slate:#b4b7c3; --stone:#8e91a0;
    --hairline:#303036; --hairline-strong:#45454d; --yellow-surface:#2e2812; --yellow-dark:#ffd76a;
    --teal-light:#123c39; --primary:#ffd02f; --on-primary:#1c1c1e; --panel:#1f1f23; --bubble:#2a2a30;
  }
}
:root[data-theme="dark"]{
  --canvas:#17171a; --surface:#202024; --dots:#34343b; --ink:#f2f2f4; --slate:#b4b7c3; --stone:#8e91a0;
  --hairline:#303036; --hairline-strong:#45454d; --yellow-surface:#2e2812; --yellow-dark:#ffd76a;
  --teal-light:#123c39; --primary:#ffd02f; --on-primary:#1c1c1e; --panel:#1f1f23; --bubble:#2a2a30;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:var(--font);
  font-size:clamp(15px,1.05vw,20px);line-height:1.5;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.stage-card:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
img{max-width:100%}

/* 머리줄 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:16px;
  padding:12px clamp(16px,2vw,32px);background:var(--canvas);border-bottom:1px solid var(--hairline)}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0}
.brand img{width:44px;height:auto}
.brand b{white-space:nowrap;font-size:1.35em;font-weight:800;letter-spacing:-.02em}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9999px;
  padding:.62em 1.3em;font-weight:700;border:1px solid var(--hairline-strong);background:transparent;white-space:nowrap}
.pill:hover{background:var(--surface)}
.pill.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.pill.primary:hover{filter:brightness(1.15)}
.pill.yellow{background:var(--yellow);color:#1c1c1e;border-color:var(--yellow)}
.pill:disabled{opacity:.4;cursor:default;background:transparent}
.pill.primary:disabled{background:var(--hairline);border-color:var(--hairline);color:var(--stone);opacity:1}
.icon-btn{width:2.5em;height:2.5em;border-radius:50%;border:1px solid var(--hairline);background:var(--canvas);
  display:inline-grid;place-items:center;padding:0}
.icon-btn svg{width:1.1em;height:1.1em}
.switch{display:inline-flex;align-items:center;gap:10px;border-radius:9999px;padding:.35em .9em .35em .4em;
  background:var(--surface);border:1px solid var(--hairline);font-weight:600}
.switch .knob{width:2.4em;height:1.4em;border-radius:9999px;background:var(--hairline-strong);position:relative;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:.2em;left:.2em;width:1em;height:1em;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-pressed="true"] .knob{background:var(--blue)}
.switch[aria-pressed="true"] .knob::after{transform:translateX(1em)}

/* 단계 목록 */
.list-view{padding:clamp(16px,2vw,32px) clamp(16px,2vw,32px) 40px}
.list-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px;margin-bottom:20px}
.list-head h1{font-size:2em;font-weight:800;letter-spacing:-.03em;margin:0}
.list-head p{margin:0;color:var(--slate)}
.notice{display:inline-block;background:var(--yellow-surface);color:var(--yellow-dark);border-radius:9999px;
  padding:4px 14px;font-weight:700;font-size:.85em}
.stage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(130px,9vw,180px),1fr));gap:clamp(12px,1.2vw,22px)}
@media (min-width:1400px){.stage-grid{grid-template-columns:repeat(10,1fr)}}
.stage-card{background:none;border:0;padding:0;text-align:left;border-radius:18px;transition:transform .15s}
.stage-card:hover{transform:translateY(-4px)}

/* 문제 카드 (다시 그린 모양) */
.qcard{position:relative;background:#f8f8f8;border-radius:14px;overflow:hidden;
  box-shadow:0 1px 0 rgba(0,0,0,.06),0 0 0 1px #e6e6e6;display:flex;flex-direction:column;color:#333}
.qcard .qtop{display:flex;justify-content:space-between;align-items:baseline;padding:9% 10% 3%}
.qcard .qname{font-weight:800;color:#e8a800;font-size:1.05em;letter-spacing:-.02em}
.qcard .qsize{font-weight:800;color:#555;font-size:.8em}
.qgrid{margin:0 10%;background:#c9c9c9;border-radius:6px;padding:.4em;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.3em}
.qcell{aspect-ratio:1;background:#c4c4c4;box-shadow:inset 0 0 0 1.5px #8f8f8f;position:relative}
.qcell.x::before,.qcell.x::after{content:"";position:absolute;left:18%;right:18%;top:50%;height:1px;background:#8a8a8a;transform:rotate(45deg)}
.qcell.x::after{transform:rotate(-45deg)}
.qcell[data-c]{box-shadow:none}
.qcell[data-c="R"]{background:var(--c-R)} .qcell[data-c="Y"]{background:var(--c-Y)}
.qcell[data-c="G"]{background:var(--c-G)} .qcell[data-c="B"]{background:var(--c-B)}
.qpal{display:flex;justify-content:center;gap:5%;padding:8% 10% 7%}
.qpal i{width:13%;aspect-ratio:1;border-radius:2px}
.qfoot{background:var(--yellow-deep);display:flex;align-items:center;gap:6%;padding:5% 6%;margin-top:auto}
.qfoot .qnum{background:#fff;border:1.5px solid #888;border-radius:6px;min-width:2em;text-align:center;font-weight:500;padding:.05em .3em}
.qfoot .qtitle{white-space:nowrap;font-weight:800;color:#333;font-size:1.05em;letter-spacing:-.02em}
.qtag{margin-left:auto;flex:none;background:#1c1c1e;color:#fff;font-size:.62em;font-weight:700;border-radius:9999px;padding:1px 6px}
.stage-card .qcard{font-size:clamp(11px,.8vw,15px);height:100%}

/* 풀이 화면 */
.play{display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,31vw,560px);gap:clamp(14px,1.4vw,24px);
  padding:clamp(12px,1.4vw,24px);height:calc(100vh - 70px);height:calc(100dvh - 70px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:560px}
.stage-area{position:relative;border-radius:28px;background-color:var(--surface);
  background-image:radial-gradient(var(--dots) 1.3px,transparent 1.4px);background-size:22px 22px;
  display:grid;place-items:center;overflow:hidden;min-height:0;container-type:size}
.board{position:relative;width:min(94cqw,calc(86cqh * 1100 / 1093));aspect-ratio:1100/1093;margin-bottom:4cqh}
.board>img{display:block;width:100%;height:100%;filter:drop-shadow(0 10px 22px rgba(20,20,40,.14))}
.cell{position:absolute;display:grid;place-items:center;border-radius:6%}
.cell.focus::before{content:"";position:absolute;inset:-4%;border-radius:10%;background:rgba(255,208,47,.38);
  box-shadow:0 0 0 3px rgba(252,185,0,.55)}
.cube{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.cell.evidence .cube{outline:4px dashed #1c1c1e;outline-offset:3px;border-radius:12%}
.cell.new .cube{animation:drop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:scale(1.35) translateY(-12%);opacity:0}to{transform:none;opacity:1}}
.cell.new::after{content:"";position:absolute;inset:-7%;border-radius:14%;border:5px solid var(--blue);animation:ring 1.6s ease-out 2}
@keyframes ring{0%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.12)}}
.badge{position:absolute;top:-10%;right:-10%;z-index:2;width:36%;aspect-ratio:1;border-radius:50%;background:var(--blue);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:clamp(12px,1.3vw,26px);box-shadow:0 0 0 3px #fff}
.cell.answer .cube{opacity:.93}
.cell.answer::after{content:"";position:absolute;inset:9%;border:3px dashed rgba(255,255,255,.95);border-radius:10%;pointer-events:none}
.letter{position:relative;z-index:1;width:46%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.92);color:#1c1c1e;
  display:none;place-items:center;font-weight:800;font-size:clamp(12px,1.35vw,28px)}
.show-letters .letter{display:grid}
.legend{position:absolute;left:18px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85em;color:var(--slate)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--blue)}
.legend .dash{width:1.1em;height:1.1em;border-radius:3px;border:2px dashed var(--slate)}

.side{display:flex;flex-direction:column;gap:clamp(12px,1.2vw,18px);min-height:0}
.info{background:var(--yellow);color:#1c1c1e;border-radius:28px;padding:clamp(16px,1.5vw,26px);display:flex;gap:16px;align-items:flex-start}
.info .txt{flex:1;min-width:0}
.info .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.info .chip{background:#1c1c1e;color:#fff;border-radius:9999px;padding:3px 14px;font-weight:800;font-size:.9em}
.info .chip.temp{background:#fff;color:#1c1c1e}
.info h2{margin:.35em 0 .2em;font-size:1.75em;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.info p{margin:0;font-size:.95em}
.info .mini{width:clamp(70px,6vw,104px);flex:none;font-size:clamp(7px,.5vw,10px)}

.helper{flex:1;min-height:0;background:var(--panel);border:1px solid var(--hairline);border-radius:28px;
  padding:clamp(14px,1.4vw,24px);display:flex;flex-direction:column;gap:14px}
.talk{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:10px}
.talk .who{flex:none;width:38%;max-width:220px;align-self:center}
.talk .who img{display:block;width:100%;height:auto}
.talk .who.pop img{animation:pop .45s ease-out}
@keyframes pop{0%{transform:translateY(10%) scale(.92);opacity:0}100%{transform:none;opacity:1}}
.bubble{position:relative;flex:1;align-self:center;background:var(--bubble);border-radius:22px;padding:1em 1.15em;font-size:1.08em;line-height:1.55}
.bubble.has-who::before{content:"";position:absolute;left:-10px;bottom:28%;border:10px solid transparent;border-right-color:var(--bubble);border-left:0}
.bubble .where{display:block;font-weight:800;font-size:1.15em;margin-bottom:.3em}
.bubble .cw{white-space:nowrap}
.bubble .sw{display:inline-block;width:.9em;height:.9em;border-radius:3px;vertical-align:-.08em;margin-right:.15em;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps span{text-align:center;border-radius:9999px;padding:.3em 0;font-weight:700;font-size:.85em;background:var(--surface);color:var(--stone);border:1px solid var(--hairline)}
.steps span.done{background:var(--teal-light);color:var(--ink);border-color:transparent}
.steps span.now{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .big{grid-column:1/-1;font-size:1.2em;padding:.8em 1em}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav .pill{flex:1}

[hidden]{display:none!important}
@media (max-width:900px){
  .play{grid-template-columns:1fr;height:auto}
  .stage-area{aspect-ratio:1;height:auto}
  .legend{position:static;justify-content:center;margin-top:8px}
  .top .switch span.lbl{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

const NAME = {R:"빨강",Y:"노랑",G:"초록",B:"파랑"};
const SHORT = {R:"빨",Y:"노",G:"초",B:"파"};
const COLORS = ["R","Y","G","B"];
const CELL_X = [[10.041,24.332],[25.84,40.13],[41.741,56.066],[57.642,71.864]];
const CELL_Y = [[10.552,24.621],[26.31,40.379],[42.069,56.138],[57.828,71.897]];

/* ===== 줄(가로·세로·대각선) ===== */
const LINES = [];
for (let r=0;r<4;r++) LINES.push({name:`${r+1}행 가로줄`, cells:[0,1,2,3].map(c=>[r,c])});
for (let c=0;c<4;c++) LINES.push({name:`${c+1}열 세로줄`, cells:[0,1,2,3].map(r=>[r,c])});
LINES.push({name:"↘ 대각선", cells:[0,1,2,3].map(i=>[i,i])});
LINES.push({name:"↙ 대각선", cells:[0,1,2,3].map(i=>[i,3-i])});
const linesOf = (r,c) => LINES.filter(L=>L.cells.some(([a,b])=>a===r&&b===c));
const parse = rows => rows.map(s=>s.split("").map(ch=>ch==="."?null:ch));
const copy = g => g.map(r=>r.slice());

function solve(grid){
  const g=copy(grid), out=[];
  (function rec(){
    if(out.length>1) return;
    for(let r=0;r<4;r++)for(let c=0;c<4;c++) if(!g[r][c]){
      const used=new Set(); linesOf(r,c).forEach(L=>L.cells.forEach(([a,b])=>g[a][b]&&used.add(g[a][b])));
      for(const x of COLORS) if(!used.has(x)){ g[r][c]=x; rec(); g[r][c]=null; }
      return;
    }
    out.push(copy(g));
  })();
  return out;
}
const colorsIn = (g,L) => L.cells.map(([a,b])=>g[a][b]).filter(Boolean);
const cands = (g,r,c) => { const u=new Set(); linesOf(r,c).forEach(L=>colorsIn(g,L).forEach(x=>u.add(x))); return COLORS.filter(x=>!u.has(x)); };
const sw = x => `<span class="cw"><i class="sw" style="background:var(--c-${x})"></i>${NAME[x]}</span>`;
const list = xs => xs.map(sw).join(", ");

/* ===== 다음 힌트 찾기: 쉬운 추론부터 ===== */
function nextHint(g){
  const empties=[]; for(let r=0;r<4;r++)for(let c=0;c<4;c++) if(!g[r][c]) empties.push([r,c]);
  // 1) 한 줄에 이미 3색이 있는 칸
  for(const L of LINES){
    const have=colorsIn(g,L);
    if(have.length===3){
      const [r,c]=L.cells.find(([a,b])=>!g[a][b]);
      const x=COLORS.find(k=>!have.includes(k));
      if(cands(g,r,c).length===1)
        return {r,c,x,lines:[L],evidence:L.cells.filter(([a,b])=>g[a][b]),
          text:`${L.name}에 ${list(have)}이(가) 이미 있어요. 남은 색은 ${sw(x)}뿐이에요!`};
    }
  }
  // 2) 여러 줄을 함께 보면 한 색만 남는 칸
  for(const [r,c] of empties){
    const cs=cands(g,r,c); if(cs.length!==1) continue;
    const x=cs[0], need=new Set(COLORS.filter(k=>k!==x)), used=[];
    const ls=linesOf(r,c).map(L=>({L,have:colorsIn(g,L)})).sort((a,b)=>b.have.length-a.have.length);
    for(const o of ls){ if(!need.size) break; const add=o.have.filter(k=>need.has(k)); if(add.length){ add.forEach(k=>need.delete(k)); used.push(o);} }
    const parts=used.map(o=>`${o.L.name}에 ${list(o.have)}`);
    const ev=[]; used.forEach(o=>o.L.cells.forEach(([a,b])=>g[a][b]&&ev.push([a,b])));
    return {r,c,x,lines:used.map(o=>o.L),evidence:ev,
      text:`${parts.join(", ")}이(가) 있어요. 이 칸에 올 수 없는 색을 빼면 ${sw(x)}만 남아요!`};
  }
  // 3) 한 줄에서 어떤 색이 들어갈 자리가 한 칸뿐
  for(const L of LINES){
    const have=colorsIn(g,L);
    for(const x of COLORS){
      if(have.includes(x)) continue;
      const spots=L.cells.filter(([a,b])=>!g[a][b]);
      const ok=spots.filter(([a,b])=>cands(g,a,b).includes(x));
      if(ok.length===1){
        const [r,c]=ok[0], ev=[];
        spots.forEach(([a,b])=>{ if(a===r&&b===c) return;
          for(const M of linesOf(a,b)){ const hit=M.cells.find(([p,q])=>g[p][q]===x); if(hit){ev.push(hit);break;} } });
        return {r,c,x,lines:[L],evidence:ev,
          text:`${L.name}에는 아직 ${sw(x)}이(가) 없어요. 그런데 다른 빈칸은 옆줄이나 대각선에 ${NAME[x]}이(가) 있어서 놓을 수 없어요. 그래서 ${NAME[x]}은(는) 이 칸이에요!`};
      }
    }
  }
  return null;
}

/* ===== 상태 ===== */
const S = { i:0, base:null, sol:null, placed:[], letters:false };
const $ = id => document.getElementById(id);

function josa(html){ // 이(가), 은(는) → 색 이름(빨강·노랑·초록·파랑)은 모두 받침이 있음
  return html.replace(/이\(가\)/g,"이").replace(/은\(는\)/g,"은");
}

function current(){ const g=copy(S.base); S.placed.forEach(p=>g[p.r][p.c]=p.x); return g; }
function hintCount(){ return S.placed.filter(p=>p.kind==="hint").length; }
function answered(){ return S.placed.some(p=>p.kind==="answer"); }

function cardHTML(st, n){
  const g=parse(st.grid); let cells="";
  for(let r=0;r<5;r++)for(let c=0;c<5;c++){
    if(r===4||c===4) cells+=`<div class="qcell x"></div>`;
    else cells+= g[r][c]?`<div class="qcell" data-c="${g[r][c]}"></div>`:`<div class="qcell"></div>`;
  }
  return `<div class="qcard">
    <div class="qtop"><span class="qname">로직큐</span><span class="qsize">4X4</span></div>
    <div class="qgrid">${cells}</div>
    <div class="qpal"><i style="background:var(--c-Y)"></i><i style="background:var(--c-G)"></i><i style="background:var(--c-R)"></i><i style="background:var(--c-B)"></i></div>
    <div class="qfoot"><span class="qnum">${n}</span><span class="qtitle">${st.title}</span>${st.temp?'<span class="qtag">임시</span>':''}</div></div>`;
}

function buildList(){
  $("stageGrid").innerHTML = STAGES.map((st,i)=>
    `<button class="stage-card" data-i="${i}" aria-label="${i+1}단계 ${st.title}${st.temp?' 임시 문제':''}">${cardHTML(st,i+1)}</button>`).join("");
  $("stageGrid").querySelectorAll(".stage-card").forEach(b=>b.onclick=()=>openStage(+b.dataset.i));
  $("tempNotice").hidden = !STAGES.some(s=>s.temp);
}

function openStage(i){
  S.i=i; S.base=parse(STAGES[i].grid); S.placed=[];
  const sols=solve(S.base); S.sol=sols.length===1?sols[0]:null;
  $("listView").hidden=true; $("playView").hidden=false; $("toList").hidden=false;
  $("stageChip").textContent=`${i+1}단계`;
  $("tempChip").hidden=!STAGES[i].temp;
  $("stageTitle").textContent=STAGES[i].title;
  const empty=S.base.flat().filter(v=>!v).length;
  $("stageDesc").textContent=`가로, 세로, 대각선에 같은 색이 겹치지 않게 빈칸 ${empty}개를 채워요.`;
  $("miniCard").innerHTML=cardHTML(STAGES[i],i+1);
  $("prevBtn").disabled=i===0; $("nextBtn").disabled=i===STAGES.length-1;
  render(null);
  window.scrollTo(0,0);
}

function showList(){ $("listView").hidden=false; $("playView").hidden=true; $("toList").hidden=true; }

function render(focus){
  const board=$("board");
  board.querySelectorAll(".cell").forEach(e=>e.remove());
  const g=current();
  const lineCells=new Set(), evid=new Set();
  if(focus){ focus.lines.forEach(L=>L.cells.forEach(([a,b])=>lineCells.add(a*4+b))); focus.evidence.forEach(([a,b])=>evid.add(a*4+b)); }
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const el=document.createElement("div"); el.className="cell";
    const [x0,x1]=CELL_X[c],[y0,y1]=CELL_Y[r];
    Object.assign(el.style,{left:x0+"%",top:y0+"%",width:(x1-x0)+"%",height:(y1-y0)+"%"});
    const p=S.placed.find(q=>q.r===r&&q.c===c);
    if(lineCells.has(r*4+c)) el.classList.add("focus");
    if(g[r][c]){
      const img=document.createElement("img"); img.className="cube"; img.src=IMG.cube[g[r][c]]; img.alt=NAME[g[r][c]]+" 큐브";
      el.appendChild(img);
      const t=document.createElement("span"); t.className="letter"; t.textContent=SHORT[g[r][c]]; el.appendChild(t);
      if(evid.has(r*4+c)) el.classList.add("evidence");
      if(p&&p.kind==="hint"){ const bd=document.createElement("span"); bd.className="badge"; bd.textContent=p.n; el.appendChild(bd); }
      if(p&&p.kind==="answer") el.classList.add("answer");
      if(focus&&focus.newCells&&focus.newCells.has(r*4+c)) el.classList.add("new");
    }
    board.appendChild(el);
  }
  board.classList.toggle("show-letters",S.letters);
  // 도우미 말풍선
  const h=hintCount(), done=answered(), full=!g.flat().includes(null);
  const who=$("who"), bub=$("bubble");
  if(!S.sol){
    who.hidden=true; bub.classList.remove("has-who");
    bub.innerHTML=`<span class="where">이 카드는 답이 하나로 정해지지 않아요</span>카드 사진을 다시 확인해 주세요.`;
  } else if(focus&&focus.msg){
    who.hidden=false; bub.classList.add("has-who");
    bub.innerHTML=focus.msg;
  } else if(h===0&&!done){
    who.hidden=false; bub.classList.add("has-who");
    bub.innerHTML=`<span class="where">힌트나 정답을 확인해 보세요.</span>아래 버튼을 눌러서 힌트나 정답을 확인할 수 있어요. 힌트는 세 번까지 볼 수 있어요.`;
  } else {
    const last=S.placed[S.placed.length-1];
    who.hidden=false; bub.classList.add("has-who");
    bub.innerHTML = last ? last.msg : "";
  }
  if(h===0&&!done){
    $("whoImg").src = IMG.intro; $("whoImg").alt = "아래 버튼을 가리키는 도우미";
  } else {
    const imgN = done ? 3 : Math.max(1,h);
    $("whoImg").src = IMG.hint[imgN-1]; $("whoImg").alt = `손가락 ${imgN}개를 편 도우미`;
  }
  // 진행 표시
  const sp=$("steps").children;
  for(let k=0;k<4;k++){ sp[k].className = (k<3 ? (k<h?"done":(k===h&&!done&&!full?"now":"")) : (done?"done":(h===3&&!full?"now":""))); }
  const btn=$("hintBtn");
  if(!S.sol){ btn.disabled=true; btn.textContent="힌트 없음"; }
  else if(full){ btn.disabled=true; btn.textContent= done?"정답을 모두 보여줬어요":"다 채웠어요!"; }
  else if(h<3){ btn.disabled=false; btn.textContent=`힌트 ${h+1} 보기`; }
  else { btn.disabled=false; btn.textContent="정답 보기"; }
  $("undoBtn").disabled=S.placed.length===0; $("resetBtn").disabled=S.placed.length===0;
}

function doHint(){
  if(!S.sol) return;
  const g=current(); if(!g.flat().includes(null)) return;
  const h=hintCount();
  if(h<3){
    let hint=nextHint(g);
    if(!hint || S.sol[hint.r][hint.c]!==hint.x){ // 안전장치
      const [r,c]=(()=>{for(let r=0;r<4;r++)for(let c=0;c<4;c++) if(!g[r][c]) return [r,c];})();
      hint={r,c,x:S.sol[r][c],lines:[],evidence:[],text:`정답을 따져 보면 이 칸은 ${sw(S.sol[r][c])}이에요.`};
    }
    const n=h+1;
    const msg=`<span class="where">힌트 ${n}: ${hint.r+1}행 ${hint.c+1}열은 ${sw(hint.x)}</span>${josa(hint.text)}`;
    S.placed.push({r:hint.r,c:hint.c,x:hint.x,kind:"hint",n,msg,lines:hint.lines,evidence:hint.evidence});
    popWho();
    render({lines:hint.lines,evidence:hint.evidence,newCells:new Set([hint.r*4+hint.c]),msg});
  } else {
    const nc=new Set(), msg=`<span class="where">정답이에요</span>점선 큐브가 정답으로 채운 칸이에요. 내 판과 한 칸씩 비교해 보세요.`;
    for(let r=0;r<4;r++)for(let c=0;c<4;c++) if(!g[r][c]){ S.placed.push({r,c,x:S.sol[r][c],kind:"answer",msg}); nc.add(r*4+c); }
    popWho();
    render({lines:[],evidence:[],newCells:nc,msg});
  }
}
function popWho(){ const w=$("who"); w.classList.remove("pop"); void w.offsetWidth; w.classList.add("pop"); }
function undo(){
  if(!S.placed.length) return;
  const last=S.placed[S.placed.length-1];
  if(last.kind==="answer") S.placed=S.placed.filter(p=>p.kind!=="answer"); else S.placed.pop();
  const top=S.placed[S.placed.length-1];
  render(top&&top.kind==="hint"?{lines:top.lines,evidence:top.evidence,msg:top.msg}:null);
}

$("hintBtn").onclick=doHint;
$("undoBtn").onclick=undo;
$("resetBtn").onclick=()=>{S.placed=[];render(null);};
$("prevBtn").onclick=()=>S.i>0&&openStage(S.i-1);
$("nextBtn").onclick=()=>S.i<STAGES.length-1&&openStage(S.i+1);
$("toList").onclick=showList; $("home").onclick=showList;
$("letters").onclick=()=>{S.letters=!S.letters;$("letters").setAttribute("aria-pressed",S.letters);$("board").classList.toggle("show-letters",S.letters);};
$("fs").onclick=()=>{ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(e){} };
buildList();
</script>
